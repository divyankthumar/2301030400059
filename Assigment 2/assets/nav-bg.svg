<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="100" viewBox="0 0 1920 100">
  <defs>
    <linearGradient id="starryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0a14;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#13131f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a14;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#starryGradient)" />
  <!-- Constellation Pattern -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="100" cy="30" r="1" />
    <circle cx="120" cy="45" r="1" />
    <circle cx="140" cy="25" r="1" />
    <line x1="100" y1="30" x2="120" y2="45" stroke="#ffffff" stroke-width="0.5" opacity="0.3" />
    <line x1="120" y1="45" x2="140" y2="25" stroke="#ffffff" stroke-width="0.5" opacity="0.3" />
    <!-- More constellation patterns -->
    <circle cx="500" cy="60" r="1" />
    <circle cx="520" cy="75" r="1" />
    <circle cx="540" cy="55" r="1" />
    <line x1="500" y1="60" x2="520" y2="75" stroke="#ffffff" stroke-width="0.5" opacity="0.3" />
    <line x1="520" y1="75" x2="540" y2="55" stroke="#ffffff" stroke-width="0.5" opacity="0.3" />
    <!-- Random stars -->
    <circle cx="300" cy="40" r="0.8" />
    <circle cx="700" cy="30" r="0.8" />
    <circle cx="900" cy="70" r="0.8" />
    <circle cx="1200" cy="50" r="0.8" />
    <circle cx="1500" cy="25" r="0.8" />
    <circle cx="1800" cy="60" r="0.8" />
  </g>
</svg>